<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northfield Manufacturing — Attack Path Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
    --border: rgba(255,255,255,0.08); --text: #c9d1d9; --text-dim: #6e7681; --text-bright: #f0f6fc;
    --critical: #ff4444; --high: #f5a623; --medium: #3fb950; --low: #58a6ff; --accent: #58a6ff;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --surface: #ffffff; --surface2: #f0f2f5;
    --border: rgba(0,0,0,0.1); --text: #24292f; --text-dim: #57606a; --text-bright: #0d1117;
    --critical: #cf222e; --high: #9a6700; --medium: #1a7f37; --low: #0969da; --accent: #0969da;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); font-family:'IBM Plex Sans',sans-serif; color:var(--text); min-height:100vh; }
  header {
    height:52px; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px; gap:16px;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { width:28px; height:28px; background:linear-gradient(135deg,#ff4444,#bc8cff); border-radius:6px; }
  .logo-text { font-size:13px; font-weight:600; color:var(--text-bright); }
  .logo-text span { color:var(--critical); }
  .header-spacer { flex:1; }
  .live-badge { display:flex; align-items:center; gap:6px; background:rgba(63,185,80,0.1); border:1px solid rgba(63,185,80,0.25); border-radius:20px; padding:3px 10px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--medium); }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--medium); animation:pulse 2s infinite; }
  .live-dot.error { background:var(--critical); animation:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .ctrl-btn { background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text-dim); font-size:13px; padding:5px 10px; cursor:pointer; }
  .ctrl-btn:hover { border-color:var(--accent); color:var(--accent); }
  .header-time { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); }

  .story-section { margin-top:32px; border-top:1px solid var(--border); padding-top:20px; max-width:820px; }
  .story-section-label { font-size:12px; color:var(--text-dim); margin-bottom:14px; text-transform:uppercase; letter-spacing:0.05em; }
  .nh2 { font-size:15px; font-weight:600; color:var(--text-bright); margin:18px 0 8px; }
  .nh3 { font-size:13px; font-weight:600; color:var(--accent); margin:14px 0 6px; }
  .nli { font-size:13px; color:var(--text); line-height:1.6; padding:2px 0 2px 14px; border-left:2px solid var(--border); margin:2px 0; }
  .nli.numbered { border-left-color:var(--accent); }
  .nspacer { height:6px; }
  .ndivider { border:none; border-top:1px solid var(--border); margin:12px 0; }
  .ntable { width:100%; border-collapse:collapse; margin:10px 0; font-size:12px; }
  .ntable td { padding:6px 10px; border:1px solid var(--border); vertical-align:top; }
  .ntable tr:first-child td { background:var(--surface2); font-weight:600; }
  .story-section code { background:var(--surface2); padding:1px 5px; border-radius:3px; font-size:12px; }

  main { max-width:1100px; margin:0 auto; padding:28px 24px 60px; }
  #loading, #error-screen { display:flex; flex-direction:column; align-items:center; gap:14px; padding:100px 0; }
  #error-screen { display:none; }
  .load-text { color:var(--text-dim); font-size:13px; }
  .err-title { color:var(--critical); font-weight:600; font-size:16px; }
  .err-msg { color:var(--text-dim); font-size:13px; text-align:center; max-width:480px; }

  #content { display:none; }
  .story-title { font-size:20px; font-weight:600; color:var(--text-bright); margin-bottom:6px; }
  .story-narrative { font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:28px; max-width:820px; }
  .story-meta { font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin-bottom:28px; }

  .chain-row { display:flex; align-items:flex-start; gap:0; overflow-x:auto; padding-bottom:12px; }
  .chain-step { display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
  .chain-arrow { display:flex; align-items:center; justify-content:center; width:36px; padding-top:60px; color:var(--text-dim); font-size:16px; flex-shrink:0; }

  .node-card { width:180px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; flex-shrink:0; }
  .node-card.game-over { border-color:var(--critical); background:rgba(255,68,68,0.06); }
  .node-card .nc-head { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .node-card .nc-icon { font-size:15px; }
  .node-card .nc-label { font-size:13px; font-weight:600; color:var(--text-bright); font-family:'IBM Plex Mono',monospace; word-break:break-all; }
  .node-card .nc-sub { font-size:11px; color:var(--text-dim); margin-bottom:8px; }
  .node-card .nc-badges { display:flex; flex-wrap:wrap; gap:4px; }
  .badge { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; white-space:nowrap; }
  .badge.crit-critical { background:rgba(255,68,68,0.15); color:var(--critical); }
  .badge.crit-high { background:rgba(245,166,35,0.15); color:var(--high); }
  .badge.crit-medium { background:rgba(63,185,80,0.15); color:var(--medium); }
  .badge.crit-low { background:rgba(88,166,255,0.15); color:var(--low); }
  .badge.cve { background:rgba(188,140,255,0.15); color:#bc8cff; }
  .badge.dim { background:rgba(255,255,255,0.06); color:var(--text-dim); }

  .terminal-card { width:220px; background:rgba(255,68,68,0.1); border:1.5px solid var(--critical); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .terminal-card .tc-title { font-size:13px; font-weight:700; color:var(--critical); }
  .terminal-card .tc-sub { font-size:11px; color:var(--text-dim); }

  .blast-section { margin-top:28px; border-top:1px solid var(--border); padding-top:18px; }
  .blast-label { font-size:12px; color:var(--text-dim); margin-bottom:10px; }
  .blast-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .blast-chip { font-size:12px; padding:5px 12px; border-radius:6px; border:1px dashed rgba(255,255,255,0.15); color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <div class="logo-text">Northfield <span>Attack</span> Path Analysis</div>
  </div>
  <div class="header-spacer"></div>
  <div class="live-badge"><div class="live-dot" id="live-dot"></div><span id="live-text">Connecting</span></div>
  <button class="ctrl-btn" id="btn-theme" title="Toggle light/dark">◐</button>
  <button class="ctrl-btn" id="btn-refresh" title="Refresh">↻</button>
  <div class="header-time" id="header-time">—</div>
</header>

<main>
  <div id="loading"><div class="load-text">Loading attack path analysis</div></div>
  <div id="error-screen">
    <div class="err-title">Connection failed</div>
    <div class="err-msg" id="err-msg"></div>
    <button class="ctrl-btn" id="btn-retry" style="margin-top:6px;">Retry</button>
  </div>
  <div id="content">
    <div class="story-title" id="story-title"></div>
    <div class="story-narrative" id="story-narrative"></div>
    <div class="story-meta" id="story-meta"></div>
    <div class="chain-row" id="chain-row"></div>
    <div class="blast-section" id="blast-section" style="display:none;">
      <div class="blast-label" id="blast-label"></div>
      <div class="blast-chips" id="blast-chips"></div>
    </div>
    <div class="story-section" id="story-section" style="display:none;">
      <div class="story-section-label">Full agent analysis</div>
      <div id="story-body"></div>
    </div>
  </div>
</main>

<script>
const WORKER_URL = 'https://northfield-attack-path-proxy.peter-northfield.workers.dev';

function nodeIcon(type) {
  if (type === 'domain_controller') return '⛁';
  if (type === 'user') return '◉';
  if (type === 'workstation' || type === 'Desktop') return '▭';
  return '▤';
}

function critBadge(crit) {
  const c = (crit || 'medium').toLowerCase();
  return `<span class="badge crit-${c}">${c}</span>`;
}

function nodeBadges(n) {
  const badges = [];
  badges.push(critBadge(n.criticality));
  if (n.cves && n.cves.length) {
    const top = n.cves[0];
    badges.push(`<span class="badge cve">${top.id}${top.cvss != null ? ' · ' + top.cvss : ''}</span>`);
  }
  if (n.monitoring_status === 'inventory_only') badges.push(`<span class="badge dim">no EDR</span>`);
  return badges.join('');
}

function nodeSub(n) {
  const parts = [];
  if (n.owner && n.owner !== n.node_id) parts.push(`Owner: ${n.owner}`);
  if (n.department) parts.push(n.department);
  if (n.ip) parts.push(n.ip);
  return parts.join(' · ') || (n.node_type === 'user' ? 'Identity' : '—');
}

function nodeCardHtml(n, isGameOver) {
  return `
    <div class="node-card${isGameOver ? ' game-over' : ''}">
      <div class="nc-head"><span class="nc-icon">${nodeIcon(n.node_type)}</span><span class="nc-label">${n.label || n.node_id}</span></div>
      <div class="nc-sub">${nodeSub(n)}</div>
      <div class="nc-badges">${nodeBadges(n)}</div>
    </div>`;
}

function renderChain(chain, gameOver) {
  const row = document.getElementById('chain-row');
  row.innerHTML = '';
  chain.forEach((step, i) => {
    const stepEl = document.createElement('div');
    stepEl.className = 'chain-step';
    const isLast = i === chain.length - 1;
    stepEl.innerHTML = step.map(n => nodeCardHtml(n, isLast && gameOver)).join('');
    row.appendChild(stepEl);
    if (i < chain.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'chain-arrow';
      arrow.textContent = '→';
      row.appendChild(arrow);
    } else if (gameOver) {
      const arrow = document.createElement('div');
      arrow.className = 'chain-arrow';
      arrow.textContent = '→';
      row.appendChild(arrow);
      const term = document.createElement('div');
      term.className = 'chain-step';
      term.innerHTML = `<div class="terminal-card"><div class="tc-title">Full domain compromise</div><div class="tc-sub">Game over — every downstream asset is assumed reachable from here</div></div>`;
      row.appendChild(term);
    }
  });
}

function renderBlastRadius(blastRadius) {
  const section = document.getElementById('blast-section');
  if (!blastRadius || !blastRadius.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('blast-label').textContent = `Blast radius — reachable, not yet confirmed (${blastRadius.length})`;
  document.getElementById('blast-chips').innerHTML = blastRadius.map(n => `<div class="blast-chip">${n.label || n.node_id}</div>`).join('');
}

function renderStory(storyHtml) {
  const section = document.getElementById('story-section');
  if (!storyHtml) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('story-body').innerHTML = storyHtml;
}

// ── THEME ──────────────────────────────────────────────
// A real deployed page (not a claude.ai artifact), so persisting a
// genuine user preference in localStorage is the right tool here.
function initTheme() {
  const saved = localStorage.getItem('northfield-theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  document.getElementById('btn-theme').addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('northfield-theme', 'dark'); }
    else { document.documentElement.setAttribute('data-theme', 'light'); localStorage.setItem('northfield-theme', 'light'); }
  });
}

async function fetchStory() {
  const r = await fetch(`${WORKER_URL}/attack-graph`);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
}

async function init() {
  document.getElementById('error-screen').style.display = 'none';
  document.getElementById('content').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';
  try {
    const story = await fetchStory();
    document.getElementById('loading').style.display = 'none';

    if (!story.chain || !story.chain.length) {
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('err-msg').textContent = 'No attack path analysis has been written yet — ask the agent a question and confirm the write.';
      document.getElementById('live-dot').classList.add('error');
      document.getElementById('live-text').textContent = 'No data';
      return;
    }

    document.getElementById('content').style.display = 'block';
    document.getElementById('story-title').textContent = story.title || 'Attack path analysis';
    document.getElementById('story-narrative').textContent = story.narrative || '';
    document.getElementById('story-meta').textContent = story.updated_at ? `Analysis: ${new Date(story.updated_at).toLocaleString()}` : '';

    renderChain(story.chain, story.gameOver);
    renderBlastRadius(story.blastRadius);
    renderStory(story.storyHtml);

    document.getElementById('live-dot').classList.remove('error');
    document.getElementById('live-text').textContent = 'Live';
    document.getElementById('header-time').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('err-msg').textContent = `${e.message} — check the Worker is deployed and WORKER_URL is set correctly`;
    document.getElementById('live-dot').classList.add('error');
    document.getElementById('live-text').textContent = 'Error';
  }
}

document.getElementById('btn-refresh').addEventListener('click', init);
document.getElementById('btn-retry').addEventListener('click', init);
initTheme();
init();
</script>
</body>
</html>
